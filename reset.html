<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tickea</title>
<style>
  body { font-family: -apple-system, system-ui, sans-serif; background: #2B2F3A; color: #F4F4F6; margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; text-align: center; padding: 24px; box-sizing: border-box; }
  .c { max-width: 360px; }
  .marque { letter-spacing: .4em; font-size: 14px; color: #FF8A78; }
  h1 { font-size: 22px; font-weight: 600; margin: 14px 0 8px; }
  p { color: #C3C6CE; line-height: 1.45; }
  .b { display: block; background: #FF6B57; color: #fff; text-decoration: none; padding: 16px; border-radius: 16px; font-size: 18px; font-weight: 600; margin: 22px 0 14px; }
  small { color: #9A9EA8; display: block; line-height: 1.4; }
</style>
</head>
<body>
<div class="c">
  <div class="marque">TICKEA</div>
  <h1 id="t">Nouveau mot de passe</h1>
  <p id="m">Touche le bouton : Tickea s'ouvre et te demande ton nouveau mot de passe.</p>
  <a id="b" class="b" href="#">Ouvrir Tickea</a>
  <small id="s">Rien ne se passe ? Ouvre ce lien sur l'iPhone où Tickea est installée, ou copie-le dans Safari.</small>
</div>
<script>
  var h = location.hash || "", q = location.search || "";
  var cible = "tickea://reset" + q + h;
  var erreur = /error/.test(h + q);
  var b = document.getElementById("b");
  b.href = cible;
  if (erreur) {
    document.getElementById("t").textContent = "Lien expiré";
    document.getElementById("m").textContent = "Ce lien a déjà été utilisé ou a expiré. Dans Tickea, redemande un e-mail depuis « Mot de passe oublié ? ».";
    b.style.display = "none";
  } else if (!h && !q) {
    document.getElementById("m").textContent = "Cette page s'ouvre depuis le lien reçu par e-mail après « Mot de passe oublié ? » dans Tickea.";
    b.style.display = "none";
  }
</script>
</body>
</html>
